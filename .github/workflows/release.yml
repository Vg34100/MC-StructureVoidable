name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create/update a DRAFT GitHub release with all matrix JARs
        type: boolean
        default: false
      publish_github:
        description: Make the GitHub draft PUBLIC after other requested stages pass
        type: boolean
        default: false
      local_preflight_passed:
        description: I ran publish:preflight successfully on this exact release revision
        type: boolean
        default: false

# Build-only runs need no release-writing permission or platform secrets.
permissions:
  contents: read

concurrency:
  group: structurevoidable-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.assets.outputs.version }}
      tag: ${{ steps.assets.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember legacy toolchain
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Require the pushed tag to match the authoritative mod version
        if: ${{ github.event_name == 'push' }}
        run: >-
          python -c 'import os, runpy;
          m=runpy.run_path("scripts/publish-release.py")["publication_plan"]();
          assert os.environ["GITHUB_REF_NAME"] == m["tag"], "Release tag does not match mod_version"'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Package matrix
        run: >-
          python build-smart.py matrix:package --max-workers=2
          "-Porg.gradle.java.installations.paths=$JAVA21_HOME,$JAVA_HOME"
        env:
          BUILD_SMART_JAVA_HOME: ${{ env.JAVA_HOME }}
      - name: Verify installable artifacts
        run: python scripts/verify-matrix-artifacts.py
      - name: Collect only verified release JARs and shared release notes
        id: assets
        run: python scripts/publish-release.py collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structurevoidable-${{ steps.assets.outputs.version }}
          path: build/publishing/github-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.create_draft || inputs.publish_github }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Require explicit safe publication stages
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CREATE_DRAFT: ${{ inputs.create_draft }}
          LOCAL_PREFLIGHT: ${{ inputs.local_preflight_passed }}
        run: |
          if [ "$CREATE_DRAFT" != true ] || [ "$LOCAL_PREFLIGHT" != true ]; then
            echo 'Release mutations require create_draft=true and local_preflight_passed=true.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: structurevoidable-${{ needs.build.outputs.version }}
          path: build/publishing/github-assets/
      - name: Restore and reverify the exact workflow artifacts
        run: python scripts/publish-release.py restore build/publishing/github-assets
      - name: Create/update one draft GitHub release
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/publishing/github-assets
          title=$(python -c 'import json; print(json.load(open("build/publishing/github-assets/manifest.json"))["title"])')
          mapfile -t jars < <(python -c 'import json, pathlib; m=json.load(open("build/publishing/github-assets/manifest.json")); print("\n".join("build/publishing/github-assets/"+pathlib.Path(r["artifact"]).name for r in m["entries"]))')
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo 'Release tag points to a different revision; refusing to change it.' >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/existing-release.json"; then
            python -c 'import json, pathlib, sys; r=json.load(open(sys.argv[1])); m=json.load(open(sys.argv[2])); expected={pathlib.Path(v["artifact"]).name for v in m["entries"]}; assert r["isDraft"], "Refusing to modify an existing public release"; assert {a["name"] for a in r["assets"]} <= expected, "Unexpected/stale draft assets; review them manually"' "$RUNNER_TEMP/existing-release.json" "$bundle/manifest.json"
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$bundle/release-notes.md"
            gh release upload "$RELEASE_TAG" "${jars[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${jars[@]}" --draft --title "$title" --notes-file "$bundle/release-notes.md" --target "$GITHUB_SHA"
          fi
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/staged-release.json"
          python -c 'import json, pathlib, sys; r=json.load(open(sys.argv[1])); m=json.load(open(sys.argv[2])); expected={pathlib.Path(v["artifact"]).name for v in m["entries"]}; assert r["isDraft"] and len(r["assets"]) == len(expected) and {a["name"] for a in r["assets"]} == expected, "GitHub draft must contain exactly the matrix installable JARs"' "$RUNNER_TEMP/staged-release.json" "$bundle/manifest.json"
      - name: Publish GitHub draft only after all requested stages succeeded
        if: ${{ github.event_name == 'push' || inputs.publish_github }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify public release assets
        if: ${{ github.event_name == 'push' || inputs.publish_github }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/public-release.json"
          python -c 'import json, pathlib, sys; r=json.load(open(sys.argv[1])); m=json.load(open(sys.argv[2])); expected={pathlib.Path(v["artifact"]).name for v in m["entries"]}; assert not r["isDraft"] and len(r["assets"]) == len(expected) and {a["name"] for a in r["assets"]} == expected, "Public release must contain exactly the verified matrix JARs"' "$RUNNER_TEMP/public-release.json" build/publishing/github-assets/manifest.json
