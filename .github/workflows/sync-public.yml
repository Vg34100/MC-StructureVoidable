name: Update public main

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/work'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set snapshot commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Copy filtered committed source to main
        run: python scripts/sync-public.py --source HEAD --push origin
