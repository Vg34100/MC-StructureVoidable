name: Build Matrix Test

on:
  push:
    branches: [work]
  pull_request:
    branches: [work, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Remember oldest toolchain
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember legacy toolchain
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile and package the property-defined matrix
        run: >-
          python build-smart.py matrix:compile --no-parallel --max-workers=2
          "-Porg.gradle.java.installations.paths=$JAVA17_HOME,$JAVA21_HOME,$JAVA_HOME"
      - run: >-
          python build-smart.py matrix:package --no-parallel --max-workers=2
          "-Porg.gradle.java.installations.paths=$JAVA17_HOME,$JAVA21_HOME,$JAVA_HOME"
      - run: python scripts/verify-matrix-artifacts.py
      - run: python scripts/check-side-safety.py
      - run: python scripts/test-config.py
      - run: python scripts/test-publishing.py
      - run: python scripts/publish-release.py collect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: structurevoidable-matrix-${{ github.sha }}
          path: build/publishing/github-assets/*.jar
          retention-days: 7
