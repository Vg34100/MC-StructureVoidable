pluginManagement {
    repositories {
        maven { url "https://maven.kikugie.dev/releases" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

rootProject.name = 'structurevoidable'

// Matrix files define both the registered targets and their dependency pins.
def matrixFiles = file('gradle/matrix').listFiles().findAll { it.name.endsWith('.properties') }.sort { it.name }
if (!matrixFiles) throw new GradleException('No matrix targets found')
stonecutter {
    centralScript = 'build.matrix.gradle'
    kotlinController = false
    create(rootProject) {
        matrixFiles.each { targetFile ->
            def target = new Properties()
            targetFile.withInputStream { target.load(it) }
            def name = targetFile.name - '.properties'
            if (name != "${target.minecraft_version}-${target.loader}" || !(target.loader in ['fabric', 'neoforge'])) {
                throw new GradleException("Invalid matrix target: ${targetFile}")
            }
            version(name, target.minecraft_version)
        }
    }
}

// Loom reads its platform before the per-target build script is evaluated.
gradle.beforeProject { project ->
    if (project.name.endsWith('-neoforge')) {
        project.extensions.extraProperties.set('loom.platform', 'neoforge')
    }
}
